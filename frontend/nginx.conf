server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
    location /api/ { proxy_pass $api_upstream$request_uri; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /health/ { proxy_pass $api_upstream$request_uri; proxy_set_header Host $host; }
    location / { try_files $uri /index.html; }
}
